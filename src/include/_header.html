<header class="header_wrap">
  @@include('_notice_tapebanner.html')
  <!-- pc -->
  <div class="header_pc_group">
    <div class="hgroup_main_row">
      <div class="hgroup_inner">
        <h1 class="hgroup_toplogo">
          <a href="#" class="toplogo_link"><span class="hdtext">삼성여행사</span></a>
        </h1>
        <div class="header_search_wrap">
          <fieldset class="hgroup_search_field">
            <legend>검색</legend>
            <div class="search_field_long_cols">
              <input type="text" placeholder="검색어를 입력하세요" class="search_field_input" />
            </div>
            <div class="search_field_short_cols">
              <a href="#" class="btn_search_field_item"><span class="hdtext">검색</span></a>
            </div>
          </fieldset>
          <div class="header_rank_field">
            <div class="swiper-container rank-container">
              <div class="swiper-wrapper">
                <div class="swiper-slide">
                  <div class="rank_slide_item">
                    <span class="rank_keyword">HOT 키워드</span>
                    <div class="rank_value_wrap"><span class="rank_value">#오사카 에어텔</span></div>
                  </div>
                </div>
                <div class="swiper-slide">
                  <div class="rank_slide_item">
                    <span class="rank_keyword">HOT 키워드</span>
                    <div class="rank_value_wrap"><span class="rank_value">#오사카 에어텔2</span></div>
                  </div>
                </div>
                <div class="swiper-slide">
                  <div class="rank_slide_item">
                    <span class="rank_keyword">HOT 키워드</span>
                    <div class="rank_value_wrap"><span class="rank_value">#오사카 에어텔3</span></div>
                  </div>
                </div>
              </div>
            </div>
            <div class="rank_all_item_wrap">
              <div class="rank_header_row">
                <div class="rank_header_obj">
                  <span class="rank_flag">HOT</span>
                  <span class="rank_header_title">인기검색어</span>
                </div>
              </div>
              <div class="rank_contents_row">
                <ul class="rank_keyword_list">
                  <li><a href="#" class="rank_keyword_item">일본</a></li>
                  <li><a href="#" class="rank_keyword_item">대마도</a></li>
                  <li><a href="#" class="rank_keyword_item">몽골</a></li>
                  <li><a href="#" class="rank_keyword_item">땡처리 항공권</a></li>
                  <li><a href="#" class="rank_keyword_item">장가계</a></li>
                  <li><a href="#" class="rank_keyword_item">상해</a></li>
                  <li><a href="#" class="rank_keyword_item">후쿠오카</a></li>
                  <li><a href="#" class="rank_keyword_item">대만</a></li>
                  <li><a href="#" class="rank_keyword_item">오키나와</a></li>
                  <li><a href="#" class="rank_keyword_item">다낭</a></li>
                </ul>
              </div>
            </div>
          </div>
        </div>
        <div class="hgroup_util_list_wrap">
          <ul class="hgroup_util_list">
            <li>
              <a href="#" class="hgroup_util">
                <i class="ico_hgutil ico_login"></i>
                <span class="hgroup_util_text">로그인</span>
              </a>
            </li>
            <li>
              <a href="#" class="hgroup_util">
                <i class="ico_hgutil ico_join"></i>
                <span class="hgroup_util_text">회원가입</span>
              </a>
            </li>
            <li>
              <a href="#" class="hgroup_util">
                <i class="ico_hgutil ico_reserve"></i>
                <span class="hgroup_util_text">예약확인/결제</span>
              </a>
            </li>
            <li>
              <a href="#" class="hgroup_util">
                <i class="ico_hgutil ico_review"></i>
                <span class="hgroup_util_text">여행후기</span>
              </a>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </div>
  <!-- // pc -->
  <!-- mobile -->
  <div class="header_mobile_group">
    <div class="header_mobile_row">
      <h1 class="mobile_toplogo">
        <a href="#" class="mobile_toplogo_link">
          <img src="./assets/images/toplogo_mobile.png" alt="삼성여행사" />
        </a>
      </h1>
      <div class="mobile_top_layer left_pos">
        <ul class="mobile_util_list">
          <li>
            <a href="#" class="btn_mb_util ico_total" name="totalmenu"><span class="mb_total_linez"></span></a>
          </li>
        </ul>
      </div>
      <div class="mobile_top_layer right_pos">
        <ul class="mobile_util_list">
          <li>
            <a href="#" class="mobile_util_menu ico_search"><span class="hdtext">검색</span></a>
          </li>
          <li>
            <a href="#" class="mobile_util_menu ico_men"><span class="hdtext">마이페이지</span></a>
          </li>
        </ul>
      </div>
    </div>
  </div>
  <!-- // mobile -->
</header>
