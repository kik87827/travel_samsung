<!-- 메인 검색 -->
<div class="main_search_container">
  <div class="main_search_wrapper">
    <div class="form_cols">
      <ul class="ms_form_list">
        <li>
          <a href="#" class="ms_form_item">
            <i class="ico shape_where"></i>
            <div class="ms_node_group">
              <div class="ms_node_placeholder">어디로 떠나세요?</div>
              <div class="ms_node_result"></div>
            </div>
          </a>
        </li>
        <li>
          <a href="#" class="ms_form_item">
            <i class="ico shape_start"></i>
            <div class="ms_node_group">
              <div class="ms_node_placeholder">출발지</div>
              <div class="ms_node_result"></div>
            </div>
          </a>
        </li>
        <li>
          <a href="javascript:;" class="ms_form_item" id="daterange">
            <i class="ico shape_date"></i>
            <div class="ms_node_group">
              <div class="ms_node_placeholder">출발일 선택</div>
              <div class="ms_node_result"></div>
            </div>
          </a>
        </li>
        <li>
          <div class="ms_form_item hasnot_arrow">
            <i class="ico shape_search"></i>
            <div class="ms_node_group">
              <input type="text" class="ms_node_input" placeholder="키워드 검색" />
            </div>
          </div>
        </li>
      </ul>
    </div>
    <div class="btn_cols">
      <a href="#" class="btn_ms_form">
        <i class="ico"></i>
        <span class="text_node">검색</span>
      </a>
    </div>
  </div>
</div>
<script>
  $(function () {
    $("#daterange").daterangepicker(
      {
        addDesign: "pos2",
        autoUpdateInput: false,
        elseMent: "출발일 선택",
        locale: {
          format: "YYYY-MM-DD",
          daysOfWeek: ["일", "월", "화", "수", "목", "금", "토"],
          monthNames: ["1월", "2월", "3월", "4월", "5월", "6월", "7월", "8월", "9월", "10월", "11월", "12월"],
          applyLabel: "적용",
        },
      },
      function (start, end) {
        // 기간 선택 완료 시 input 값 채움
        $("#daterange").val(start.format("YYYY-MM-DD") + " ~ " + end.format("YYYY-MM-DD"));
      }
    );
    $("#daterange").on("show.daterangepicker", function (ev, picker) {
      rightCheck();
    });
    $("#daterange").on("apply.daterangepicker", function (ev, picker) {
      let thisObj = $(this);
      thisObj.val(picker.startDate.format("YYYY-MM-DD") + " ~ " + picker.endDate.format("YYYY-MM-DD"));
      thisObj.find(".ms_node_result").text(picker.startDate.format("YYYY-MM-DD") + " ~ " + picker.endDate.format("YYYY-MM-DD"));
      thisObj.addClass("result_mode");
    });

    /* prettier-ignore */
    $(window).on("resize", function () {
      rightCheck();
    }).resize();

    function rightCheck() {
      const $daterangeItem = $(".daterangepicker.show-calendar");

      $daterangeItem.removeClass("right_end");

      const margin = 20;
      const windowWidth = $(window).width();
      const rightPos = $daterangeItem.offset().left + $daterangeItem.outerWidth();
      console.log(windowWidth, rightPos);
      if (rightPos > windowWidth - margin) {
        $daterangeItem.addClass("right_end");
      }
    }
  });
</script>
